<div class="profile-page">

  <div class="profile-header">
    <div>
      <h1>My Profile</h1>
      <p>Manage your vendor profile information.</p>
    </div>

    <div class="profile-badge">
      <span class="material-icons">person</span>
      Vendor
    </div>
  </div>

  <div class="profile-card">

    <div class="section-title">
      <span class="material-icons">account_circle</span>
      <div>
        <h2>Profile Information</h2>
        <p>View and manage your account details.</p>
      </div>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          [(ngModel)]="profile.full_name"
          placeholder="Enter your full name"
        />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="profile.email"
          readonly
        />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input
          type="text"
          [(ngModel)]="profile.phone"
          placeholder="Enter phone number"
        />
      </div>

      <div class="form-group">
        <label>Company Name</label>
        <input
          type="text"
          [(ngModel)]="profile.company_name"
          placeholder="Enter company name"
        />
      </div>

      <div class="form-group">
        <label>Vendor Category</label>

        <select [(ngModel)]="profile.category">

          <option value="">Select category</option>

          <option value="Raw Material Suppliers">
            Raw Material Suppliers
          </option>

          <option value="Equipment Vendors">
            Equipment Vendors
          </option>

          <option value="IT Vendors">
            IT Vendors
          </option>

          <option value="Service Providers">
            Service Providers
          </option>

          <option value="Logistics Partners">
            Logistics Partners
          </option>

          <option value="Maintenance Vendors">
            Maintenance Vendors
          </option>

        </select>
      </div>

      <div class="form-group">
        <label>Location</label>
        <input
          type="text"
          [(ngModel)]="profile.location"
          placeholder="Enter location"
        />
      </div>

    </div>

    <div class="actions">

      <button
        type="button"
        class="save-btn"
        (click)="saveProfile()"
      >
        <span class="material-icons">save</span>
        Save Profile
      </button>

    </div>

    <div
      class="success-message"
      *ngIf="message"
    >
      <span class="material-icons">check_circle</span>
      {{ message }}
    </div>

  </div>

</div>
